# v* 태그를 push하면 테스트 → 빌드 → zip 두 개를 Releases에 올린다.
# 로컬 빌드 대신 여기서 릴리스하는 이유: 공개된 소스 그대로 빌드된다는 걸 누구나 확인할 수
# 있고, 각 zip에 출처 증명(provenance attestation)이 첨부된다.
#   검증:  gh attestation verify <zip파일> --repo <소유자>/WinDimmer
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

# 태그 이름은 스크립트에 직접 보간하지 않고 env로 넘긴다 — $ 나 따옴표가 든 태그가
# 스크립트로 실행되는 일을 막는다.
env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet test -c Release

      # -p:Version을 태그에서 뽑아 넘긴다 — csproj의 <Version>을 안 올리고 태그만 밀어도
      # 트레이 메뉴·설정 창에 표시되는 버전이 태그와 일치하게.
      # IncludeNativeLibrariesForSelfExtract가 없으면 WPF/WinForms의 네이티브 DLL 5개가
      # exe 옆에 따로 떨어져 나와, exe만 옮기면 실행되지 않는다.
      - name: Publish (self-contained)
        shell: pwsh
        run: >
          dotnet publish src/WinDimmer/WinDimmer.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          "-p:Version=$($env:TAG -replace '^v','')" -o out/selfcontained

      # .NET 8 데스크톱 런타임이 있는 사용자를 위한 저용량판
      - name: Publish (lite, requires .NET 8)
        shell: pwsh
        run: >
          dotnet publish src/WinDimmer/WinDimmer.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          "-p:Version=$($env:TAG -replace '^v','')" -o out/lite

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path out/selfcontained/* -DestinationPath "WinDimmer-${env:TAG}-win-x64.zip"
          Compress-Archive -Path out/lite/* -DestinationPath "WinDimmer-${env:TAG}-win-x64-lite-requires-dotnet8.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: WinDimmer-*.zip

      - name: Create release
        shell: pwsh
        run: |
          # @()로 감싸야 파일이 하나뿐일 때도 배열로 남는다 — 스칼라를 네이티브 명령에
          # 그대로 넘기면 문자 단위로 쪼개지는 사고가 난다.
          $zips = @(Get-ChildItem WinDimmer-*.zip).FullName
          gh release create $env:TAG $zips --title "WinDimmer $env:TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
